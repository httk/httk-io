[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-io"
version = "0.2.0"
description = "httk₂ file input/output (CIF and mCIF readers/writers)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "rickard-gpg@armiento.net" }]
dependencies = [
  "httk-core>=2.0.2,<3",
]
keywords = [
  "Materials Discovery",
  "Materials Informatics",
  "Materials Science",
  "CIF",
  "Crystallography",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://httk.org"
Documentation = "https://docs.httk.org/httk-io/"
Repository = "https://github.com/httk/httk-io"
Issues = "https://github.com/httk/httk-io/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"httk.io" = ["py.typed"]
"httk.registry.io.io" = ["py.typed"]

[project.optional-dependencies]
default = ["httk-io[numpy]"]
numpy = ["httk-core[numpy]"]
dev = [
  "pytest>=8.0",
  "httk-io[numpy]",
  "ruff>=0.16,<0.17",
  "pyright",
  "mypy",
  "pydoclint>=0.9,<1"
]
docs = [
  "sphinx",
  "furo",
  "myst-parser",
  "myst-nb",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "sphinx-autoapi",
  "httk-atomistic"
]
release = [
  "build>=1.2",
  "twine>=6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not extended'"
markers = [
  "extended: full-depth test case; selected only by the extended test profile",
]

[tool.ruff]
target-version = "py312"
src = ["src", "examples"]
line-length = 120

[tool.ruff.lint]
# TRY002: raising plain Exception is accepted httk style.
# TRY004: the ValueError/TypeError choice is public API; do not churn it.
# BLE001: broad excepts deliberately isolate plugin/loader/handler failures.
ignore = ["TRY002", "TRY004", "BLE001"]

[tool.ruff.format]
# preserve replaces black's skip-string-normalization: existing quote styles are kept.
quote-style = "preserve"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "examples"]
extraPaths = ["src"]
venvPath = ".."
venv = ".venv"
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["src", "examples"]
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
skip-checking-raises = true
